<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLS Gangwisch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: rgb(19, 18, 20);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hidden-source {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 320px;
      height: 240px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <video id="bgVideo" class="hidden-source" src="mov/jls.mp4" autoplay loop muted playsinline></video>
  <img id="streamImg" class="hidden-source" crossorigin="anonymous" src="https://stream0.jgang1.workers.dev/" alt="Live Stream" />

  <script>
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl");
    const video = document.getElementById("bgVideo");
    const img = document.getElementById("streamImg");

    const vsSource = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        v_uv.y = 1.0 - v_uv.y;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fsSource = `
      precision mediump float;
      varying vec2 v_uv;

      uniform sampler2D u_videoTex;
      uniform sampler2D u_streamTex;
      uniform float u_mix;
      uniform float u_canvasAspect;
      uniform float u_videoAspect;
      uniform float u_streamAspect;
      uniform vec3 u_bgColor;

      vec2 containUV(vec2 uv, float canvasAspect, float mediaAspect) {
        vec2 scale = vec2(1.0);
        if (canvasAspect > mediaAspect) {
          scale.x = mediaAspect / canvasAspect;
        } else {
          scale.y = canvasAspect / mediaAspect;
        }
        return (uv - 0.5) / scale + 0.5;
      }

      vec4 sampleContain(sampler2D tex, vec2 uv, float canvasAspect, float mediaAspect) {
        vec2 mappedUV = containUV(uv, canvasAspect, mediaAspect);
        if (mappedUV.x < 0.0 || mappedUV.x > 1.0 || mappedUV.y < 0.0 || mappedUV.y > 1.0) {
          return vec4(u_bgColor, 1.0);
        }
        return texture2D(tex, mappedUV);
      }

      void main() {
        vec4 vidColor = sampleContain(u_videoTex, v_uv, u_canvasAspect, u_videoAspect);
        vec4 streamColor = sampleContain(u_streamTex, v_uv, u_canvasAspect, u_streamAspect);
        gl_FragColor = mix(vidColor, streamColor, u_mix);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    function createTexture(unit) {
      const tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      // Fixed: 4 bytes (R, G, B, A) matching rgb(19, 18, 20)
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([19, 18, 20, 255]));
      return tex;
    }

    const videoTex = createTexture(0);
    const streamTex = createTexture(1);

    gl.uniform1i(gl.getUniformLocation(program, "u_videoTex"), 0);
    gl.uniform1i(gl.getUniformLocation(program, "u_streamTex"), 1);
    gl.uniform3f(gl.getUniformLocation(program, "u_bgColor"), 19 / 255, 18 / 255, 20 / 255);

    const uMixLoc = gl.getUniformLocation(program, "u_mix");
    const uCanvasAspectLoc = gl.getUniformLocation(program, "u_canvasAspect");
    const uVideoAspectLoc = gl.getUniformLocation(program, "u_videoAspect");
    const uStreamAspectLoc = gl.getUniformLocation(program, "u_streamAspect");

    function resize() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    video.addEventListener("loadeddata", () => {
      video.play().catch(err => console.warn("Video play blocked:", err));
    });
    video.load();

    function smoothstep(edge0, edge1, x) {
      const n = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return n * n * (3 - 2 * n);
    }

    function render(timeMs) {
      const t = timeMs * 0.001;

      if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        try {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        } catch (e) {}
      }

      if (img.complete && img.naturalWidth > 0) {
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, streamTex);
        try {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        } catch (e) {}
      }

      const cycle = (Math.sin(t * 0.5) + 1.0) * 0.5;
      const mixAmount = smoothstep(0.15, 0.85, cycle);

      const canvasAspect = canvas.width / canvas.height;
      const videoAspect = (video.videoWidth && video.videoHeight) ? (video.videoWidth / video.videoHeight) : canvasAspect;
      const streamAspect = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : canvasAspect;

      gl.uniform1f(uMixLoc, mixAmount);
      gl.uniform1f(uCanvasAspectLoc, canvasAspect);
      gl.uniform1f(uVideoAspectLoc, videoAspect);
      gl.uniform1f(uStreamAspectLoc, streamAspect);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
