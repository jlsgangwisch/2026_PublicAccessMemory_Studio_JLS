<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLS Gangwisch 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            animation: colorFade 16s ease-in-out infinite;
        }

        h1 {
            color: #ffffff;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 20px;
        }

        @keyframes colorFade {
            0% {
                background-color: #ff2a6d; 
            }
            25% {
                background-color: #05d9e8; 
            }
            50% {
                background-color: #01012b;
            }
            75% {
                background-color: #8a2be2; 
            }
            100% {
                background-color: #ff2a6d;
            }
        }
    </style>
</head>
<body>

    <h1>JLS Gangwisch 2026</h1>

</body>
</html>
